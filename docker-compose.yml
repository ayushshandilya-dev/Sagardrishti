# Ground rules: `docker compose up` runs ONLY the backend + dashboard.
# The web console is Docker-optional; run it natively with `npm run dev`
# (see README) unless you explicitly want the "full" profile.
#
#   docker compose up -d               # backend API + Streamlit dashboard
#   docker compose --profile full up -d  # + web console on :3000

services:
  # API Gateway
  api:
    build: ./docker
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/app:rw

  # Streamlit Dashboard
  dashboard:
    build: ./docker
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - PYTHONUNBUFFERED=1
    depends_on:
      - api

  # Web Console (optional — enable with --profile full)
  frontend:
    build: ./frontend
    profiles: ["full"]
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

