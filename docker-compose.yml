# Sagar-Drishti stack
#   docker compose up -d                   # API + Postgres + Streamlit analyst dashboard
#   docker compose --profile full up -d    # + Next.js ops COP on :3000
#
# The API runs against a real PostgreSQL store (seeded automatically on boot).
#
# REQUIRED env vars (set via .env file or shell export):
#   POSTGRES_PASSWORD     — Postgres password
#   NODE_SIGNING_KEY      — 64 hex chars (generate: openssl rand -hex 32)
#   CORS_ORIGINS          — e.g. https://<project>.vercel.app (wildcard * is rejected in production)
#
# If any are missing, the API will refuse to start (validate_production guard).

services:
  # Postgres store — the source of truth for incidents, vessels, evidence ledger,
  # and computation audit trails.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sagar_drishti
      POSTGRES_USER: sagar_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sagar_secure_pw}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagar_user -d sagar_drishti"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API Gateway (slim image — no GDAL/torch toolchain needed)
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://sagar_user:${POSTGRES_PASSWORD:-sagar_secure_pw}@postgres:5432/sagar_drishti
      - CORS_ORIGINS=${CORS_ORIGINS}
      - API_ENV=production
      - NODE_SIGNING_KEY=${NODE_SIGNING_KEY}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy

  # Streamlit Analyst Dashboard — rapid visual forensics (attribution breakdown,
  # drift trajectories, evidence chain explorer). Separate from the Next.js ops COP.
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - PYTHONUNBUFFERED=1
      - API_BASE_URL=http://api:8000
    depends_on:
      - api

  # Web Console (optional — enable with --profile full)
  frontend:
    build: ./frontend
    profiles: ["full"]
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  pg_data: